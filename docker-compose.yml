# Mini Distributed Cloud Object Store: 1 controller + 4 workers (+ optional client).
#
#   docker compose up -d --build                 # start the cluster
#   docker compose run --rm client cluster       # use the containerised client
#   docker stop worker2 && docker start worker2  # failure demo
#
# Every worker has its own named volume, so chunk data survives container
# stops/restarts and `docker compose down` (use `down -v` to wipe it).

x-worker: &worker
  build: ./worker
  restart: unless-stopped
  depends_on:
    - controller
  networks: [objstore]

x-worker-env: &worker-env
  CONTROLLER_URL: http://controller:8000
  HEARTBEAT_INTERVAL: "3"
  SCRUB_INTERVAL: "60"
  INTERNAL_TOKEN: ${INTERNAL_TOKEN:-change-me}

services:
  controller:
    build: ./controller
    container_name: controller
    restart: unless-stopped
    ports:
      - "${CONTROLLER_PORT:-8080}:8000"
    environment:
      CHUNK_SIZE: "1048576"
      REPLICATION_FACTOR: "2"
      HEARTBEAT_TIMEOUT: "10"
      REPAIR_GRACE_PERIOD: "${REPAIR_GRACE_PERIOD:-20}"
      MAINTENANCE_INTERVAL: "5"
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-change-me}
    volumes:
      - controller-data:/data
    networks: [objstore]

  worker1:
    <<: *worker
    container_name: worker1
    hostname: worker1
    environment:
      <<: *worker-env
      WORKER_ID: worker1
      WORKER_URL: http://worker1:8000
    volumes:
      - worker1-data:/data

  worker2:
    <<: *worker
    container_name: worker2
    hostname: worker2
    environment:
      <<: *worker-env
      WORKER_ID: worker2
      WORKER_URL: http://worker2:8000
    volumes:
      - worker2-data:/data

  worker3:
    <<: *worker
    container_name: worker3
    hostname: worker3
    environment:
      <<: *worker-env
      WORKER_ID: worker3
      WORKER_URL: http://worker3:8000
    volumes:
      - worker3-data:/data

  worker4:
    <<: *worker
    container_name: worker4
    hostname: worker4
    environment:
      <<: *worker-env
      WORKER_ID: worker4
      WORKER_URL: http://worker4:8000
    volumes:
      - worker4-data:/data

  # One or more clients: `docker compose run --rm client <command>`.
  # ./demo-data on the host is mounted at /work inside the container.
  client:
    build: ./client
    profiles: ["client"]
    environment:
      OBJSTORE_URL: http://controller:8000
    volumes:
      - ./demo-data:/work
    networks: [objstore]

volumes:
  controller-data:
  worker1-data:
  worker2-data:
  worker3-data:
  worker4-data:

networks:
  objstore:
